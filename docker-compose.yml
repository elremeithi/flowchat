services:
  flowchat:
    build: .
    image: flowchat:latest
    container_name: flowchat
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PASSWORD: "${APP_PASSWORD:-}"            # required: a long password of your own
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-}"          # recommended: encrypts messages and files on disk. Keep a copy; without it the data is unreadable.
      TOTP_SECRET: "${TOTP_SECRET:-}"             # recommended: authenticator-app code at sign-in (see README)
      REQUIRE_HTTPS: "${REQUIRE_HTTPS:-0}"          # set to 1 once it runs behind an HTTPS proxy
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-}"           # e.g. flow.example.com
      WEBHOOK_URL: "${WEBHOOK_URL:-}"             # optional: announce new messages to this address
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"          # optional: signs outgoing webhooks
      MAX_UPLOAD_MB: "2048"
      PUID: "99"
      PGID: "100"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      - /mnt/user/appdata/flowchat:/data
